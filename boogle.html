<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boogle</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 3rem 1rem;
         color: #1a1a1a; background: #fff; }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 2.5rem; margin: 0 0 1.5rem; letter-spacing: -0.02em; }
  form { display: flex; gap: 0.5rem; }
  input { flex: 1; font: inherit; padding: 0.6rem 0.8rem; border: 1px solid #ccc;
          border-radius: 6px; min-width: 0; }
  button { font: inherit; padding: 0.6rem 1.2rem; border: 0; border-radius: 6px;
           background: #1a73e8; color: #fff; cursor: pointer; }
  h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em;
       color: #666; margin: 2.5rem 0 0.5rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 0.5rem 0; border-bottom: 1px solid #eee; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>Boogle</h1>
  <form action="/search" method="get">
    <input type="text" name="q" data-testid="q" autocomplete="off"
           spellcheck="false" placeholder="Search Boogle" aria-label="Search">
    <button type="submit" data-testid="go">Search</button>
  </form>
  <h2>Your recent searches</h2>
  <ul id="history" data-testid="history"></ul>
</main>
<script>
// Ask the server what this browser has searched for, via cookie lookup. 
fetch("/api/history", { credentials: "same-origin" })
  .then(function (response) { return response.json(); })
  .then(function (data) {
    var list = document.getElementById("history");
    (data.searches || []).forEach(function (search) {
      var item = document.createElement("li");
      item.dataset.testid = "history-item";
      // textContent, never innerHTML: whatever was typed is shown as text,
      // never parsed as markup.
      item.textContent = search.query;
      list.appendChild(item);
    });
  })
  .catch(function () {
    console.log("No wiring here yet.");
  });
</script>
</body>
</html>
